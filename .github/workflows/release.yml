name: Release

# v0.2.0 のようなタグを押すと、APK を焼いて GitHub Release に付ける (docs/install.md)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.DENPA_TV_KEYSTORE_BASE64 }}
          DENPA_TV_KEYSTORE_PASSWORD: ${{ secrets.DENPA_TV_KEYSTORE_PASSWORD }}
          DENPA_TV_KEY_ALIAS: ${{ secrets.DENPA_TV_KEY_ALIAS }}
          DENPA_TV_KEY_PASSWORD: ${{ secrets.DENPA_TV_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          export DENPA_TV_VERSION="$version"
          # 版の数字から並ぶ番号を作る (0.2.13 → 213、1.0.0 → 10000)。上げるたびに増える
          IFS=. read -r major minor patch <<< "${version%%-*}"
          export DENPA_TV_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export DENPA_TV_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --console=plain
            cp app/build/outputs/apk/release/app-release.apk "denpa-tv-$version.apk"
          else
            # 鍵がまだ無いときは debug の署名で出す (あとで鍵を入れると、入れ直しが要る)
            echo "::warning::署名の鍵 (DENPA_TV_KEYSTORE_BASE64) が無いので debug の署名で出します"
            ./gradlew assembleDebug --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk "denpa-tv-$version-debug.apk"
          fi
          sha256sum denpa-tv-*.apk > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" denpa-tv-*.apk SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
